min_version: 2.2.2

pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: ruff-0.17.3 check --force-exclude -- {staged_files}
    ruff-format:
      glob: "*.py"
      run: ruff-0.17.3 format --check --force-exclude -- {staged_files}

# Full, offline regression suite. Requires the opt-in test environment:
#   python3 -m venv .venv && .venv/bin/python -m pip install -r requirements-test.txt
pre-push:
  commands:
    pytest:
      run: |
        # Test subprocesses must discover their own temporary Git repositories.
        git_local_vars="$(git rev-parse --local-env-vars)" || exit 1
        for name in $git_local_vars; do
          unset "$name"
        done
        exec .venv/bin/python -m pytest -q
